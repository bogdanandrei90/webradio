<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web Radio Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  
  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Radio" />
  <link rel="apple-touch-icon" href="icon.png" />
  
  <!-- Theme Colors -->
  <meta name="theme-color" content="#1c1c1c" />

  <style>
    :root {
      --bg-primary: #111;
      --bg-secondary: #1c1c1c;
      --bg-tertiary: #222;
      --bg-button: #333;
      --bg-button-sort: #555;
      --text-primary: #fff;
      --text-secondary: #aaa;
      --text-tertiary: #888;
      --accent: #1db954;
    }

    body.day-mode {
      --bg-primary: #f5f5f5;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e8e8e8;
      --bg-button: #d0d0d0;
      --bg-button-sort: #b0b0b0;
      --text-primary: #000;
      --text-secondary: #555;
      --text-tertiary: #777;
      --accent: #1db954;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    .radio {
      background: var(--bg-secondary);
      padding: 20px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      transition: background 0.3s;
    }

    h2 {
      margin-bottom: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: none;
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    button {
      padding: 10px 14px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .play {
      background: #1db954;
      color: #000;
    }

    .pause {
      background: #ff4d4d;
      color: #000;
    }

    .refresh {
      background: #f0a500;
      color: #000;
    }

    .theme-toggle {
      background: var(--bg-button-sort);
      color: var(--text-primary);
      font-size: 20px;
      padding: 8px 12px;
      margin-left: 10px;
    }

    .preset {
      background: var(--bg-button);
      color: var(--text-primary);
      width: 100%;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background 0.3s;
    }

    .sort {
      background: var(--bg-button-sort);
      color: var(--text-primary);
      font-size: 12px;
      padding: 6px 10px;
    }

    .volume {
      margin-top: 15px;
      text-align: left;
    }

    .volume input {
      width: 100%;
    }

    .loading {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      display: none;
    }

    .now-playing {
      background: var(--bg-tertiary);
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: left;
      display: none;
      transition: background 0.3s;
    }

    .now-playing h4 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: var(--text-tertiary);
      text-transform: uppercase;
    }

    .now-playing .track {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .now-playing .artist {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .elapsed-time {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 8px;
    }

    .equalizer {
      display: inline-flex;
      align-items: flex-end;
      height: 16px;
      gap: 2px;
      margin-right: 8px;
    }

    .equalizer span {
      width: 3px;
      background: var(--accent);
      animation: equalize 1s ease-in-out infinite;
    }

    .equalizer span:nth-child(1) { animation-delay: 0s; }
    .equalizer span:nth-child(2) { animation-delay: 0.2s; }
    .equalizer span:nth-child(3) { animation-delay: 0.4s; }
    .equalizer span:nth-child(4) { animation-delay: 0.6s; }

    @keyframes equalize {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }
  </style>
</head>
<body>

<div class="radio">
  <h2>Web Radio <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button></h2>

  <!-- Playback / Refresh -->
  <div>
    <button id="playPauseButton" class="play" onclick="togglePlayback()" style="display: none;">▶ Play</button>
    <button class="refresh" onclick="forceRefresh()">↻ Refresh</button>
  </div>

  <!-- Loading indicator -->
  <div class="loading" id="loading">
    Loading stream...
  </div>

  <!-- Now Playing -->
  <div class="now-playing" id="nowPlaying">
    <h4>Now Playing</h4>
    <div class="track" id="trackTitle">
      <div class="equalizer" id="equalizer">
        <span></span><span></span><span></span><span></span>
      </div>
      <span id="stationName">-</span>
    </div>
    <div class="artist" id="artistName">-</div>
  </div>

  <!-- Volume -->
  <div class="volume">
    <label>Volume <span id="volumeNote" style="font-size: 10px; color: var(--text-tertiary);"></span></label>
    <input
      type="range"
      id="volumeSlider"
      min="0"
      max="1"
      step="0.01"
      value="0.7"
      oninput="setVolume(this.value)"
      onchange="setVolume(this.value)"
    />
  </div>

  <!-- Presets -->
  <h3 style="margin-top: 15px;">Presets</h3>

  <div id="presets-container">
    <button class="preset" onclick="playPreset('https://megastar-cope.flumotion.com/playlist.m3u8', 'MegaStar FM')">MegaStar FM</button>
    <button class="preset" onclick="playPreset('https://edge126.rcs-rds.ro/profm/dancefm.mp3', 'Dance FM')">Dance FM</button>
    <button class="preset" onclick="playPreset('https://s7.yesstreaming.net/stream/8000', 'Off Radio')">Off Radio</button>
    <button class="preset" onclick="playPreset('https://media-ssl.musicradio.com/Capital', 'Capital FM')">Capital FM</button>
    <button class="preset" onclick="playPreset('https://smooth.vanillaradio.com:8032/live', 'Vanilla Smooth Radio')">Vanilla Smooth Radio</button>
    <button class="preset" onclick="playPreset('https://stream.vanillaradio.com:8016/stream/stream', 'Vanilla Deep Radio')">Vanilla Radio</button>
    <button class="preset" onclick="playPreset('https://stream.radiojar.com/2kqw1800x68uv', 'ManCode Radio')">ManCode Radio</button>
    <button class="preset" onclick="playPreset('https://astreaming.edi.ro:8443/EuropaFM_aac', 'Europa FM')">Europa FM</button>
    <button class="preset" onclick="playPreset('https://n23-eu.rcs.revma.com/txdn8d324ucwv', 'MC2')">MC2</button>
    <button class="preset" onclick="playPreset('https://s1-webradio.antenne.de/antenne/stream/aacp', 'Antenne Bayern')">Antenne Bayern</button>
  </div>

  <audio id="audio"></audio>
</div>

<script>
  const audio = document.getElementById("audio");
  const loading = document.getElementById("loading");
  const nowPlaying = document.getElementById("nowPlaying");
  const stationName = document.getElementById("stationName");
  const artistName = document.getElementById("artistName");
  const equalizer = document.getElementById("equalizer");
  const playPauseButton = document.getElementById("playPauseButton");

  let currentStreamUrl = "";
  audio.volume = 0.7;

  // Theme toggling
  function toggleTheme() {
    const body = document.body;
    const themeToggle = document.getElementById('themeToggle');
    body.classList.toggle('day-mode');
    
    if (body.classList.contains('day-mode')) {
      themeToggle.textContent = '☀️';
      localStorage.setItem('theme', 'day');
    } else {
      themeToggle.textContent = '🌙';
      localStorage.setItem('theme', 'night');
    }
  }

  // Auto-detect time-based theme on load
  function initTheme() {
    const savedTheme = localStorage.getItem('theme');
    const hour = new Date().getHours();
    const themeToggle = document.getElementById('themeToggle');
    
    if (savedTheme === 'day' || (!savedTheme && hour >= 6 && hour < 18)) {
      document.body.classList.add('day-mode');
      themeToggle.textContent = '☀️';
    } else {
      themeToggle.textContent = '🌙';
    }
  }

  // Initialize theme on page load
  initTheme();

  // Show Now Playing with station name and equalizer
  function showNowPlaying(station) {
    equalizer.style.display = "inline-flex";
    stationName.textContent = station || "Web Radio";
    artistName.style.display = "none"; // Hide the artist line
    nowPlaying.style.display = "block";
  }

  function updatePlaybackButton() {
    const isPlaying = !audio.paused && !audio.ended;
    playPauseButton.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
    playPauseButton.className = isPlaying ? 'pause' : 'play';
  }

  function togglePlayback() {
    if (audio.paused || audio.ended) {
      playRadio();
    } else {
      audio.pause();
      loading.style.display = "none";
      updatePlaybackButton();
    }
  }

  function playRadio(url = currentStreamUrl) {
    if (!url) {
      alert("Please select a preset first.");
      return;
    }

    if (audio.src !== url) {
      audio.src = url;
    }

    loading.style.display = "block";
    updatePlaybackButton();

    audio.play().then(() => {
      updatePlaybackButton();
    }).catch(() => {
      loading.style.display = "none";
      updatePlaybackButton();
      alert("Unable to play this stream.");
    });
  }

  function forceRefresh() {
    if (!currentStreamUrl) {
      alert("Please select a preset first.");
      return;
    }

    if (audio.src !== currentStreamUrl) {
      audio.src = currentStreamUrl;
    }

    loading.style.display = "block";
    audio.load();

    audio.play().catch(() => {
      loading.style.display = "none";
      alert("Unable to refresh this stream.");
    });
  }

  function setVolume(value) {
    try {
      audio.volume = value;
      // Test if volume was actually set (iOS blocks this)
      if (Math.abs(audio.volume - value) > 0.01) {
        // Volume control is blocked (iOS)
        document.getElementById('volumeNote').textContent = '(Use device buttons)';
        document.getElementById('volumeSlider').disabled = true;
        document.getElementById('volumeSlider').style.opacity = '0.5';
      }
    } catch (e) {
      // Volume control not supported
      document.getElementById('volumeNote').textContent = '(Use device buttons)';
      document.getElementById('volumeSlider').disabled = true;
      document.getElementById('volumeSlider').style.opacity = '0.5';
    }
  }

  // Check if volume control is supported
  function checkVolumeSupport() {
    const testAudio = new Audio();
    testAudio.volume = 0.5;
    if (Math.abs(testAudio.volume - 0.5) > 0.01) {
      // Volume control is not supported (iOS)
      document.getElementById('volumeNote').textContent = '(Use device buttons)';
      document.getElementById('volumeSlider').disabled = true;
      document.getElementById('volumeSlider').style.opacity = '0.5';
    }
  }

  // Check volume support on load
  checkVolumeSupport();

  function playPreset(url, stationDisplayName) {
    currentStreamUrl = url;
    playPauseButton.style.display = "inline-block";
    showNowPlaying(stationDisplayName || "Web Radio");
    playRadio(url);
  }

  audio.addEventListener("playing", () => {
    loading.style.display = "none";
    updatePlaybackButton();
  });

  audio.addEventListener("pause", () => {
    updatePlaybackButton();
  });

  audio.addEventListener("ended", () => {
    updatePlaybackButton();
  });

  audio.addEventListener("waiting", () => {
    loading.style.display = "block";
  });

  audio.addEventListener("error", () => {
    loading.style.display = "none";
    updatePlaybackButton();
    alert("Stream error.");
  });

  updatePlaybackButton();

  // Register Service Worker for PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Service Worker registered'))
      .catch(err => console.log('Service Worker registration failed:', err));
  }
</script>

</body>
</html>
