=<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Player</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Radio" />

  <!-- Theme Colors -->
  <meta name="theme-color" content="#0a0c10" />

  <style>
    :root {
      --bg: #0a0c10;
      --bg-soft: #10131a;
      --panel: rgba(18, 21, 28, 0.92);
      --panel-2: #171b23;
      --panel-3: #1d232d;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(93, 167, 255, 0.32);
      --text: #f4f7fb;
      --muted: #a3adbb;
      --faint: #7b8493;
      --accent: #5da7ff;
      --accent-soft: rgba(93, 167, 255, 0.12);
      --accent-strong: #7fc0ff;
      --success: #4fc36b;
      --danger: #ff7b7b;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --radius-sm: 14px;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] {
      --bg: #eef3fa;
      --bg-soft: #e7edf6;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-2: #f7f9fc;
      --panel-3: #eff4fb;
      --border: rgba(15, 23, 42, 0.09);
      --border-strong: rgba(49, 113, 198, 0.28);
      --text: #111827;
      --muted: #5f6b7c;
      --faint: #7f8a98;
      --accent: #3171c6;
      --accent-soft: rgba(49, 113, 198, 0.1);
      --accent-strong: #4a85d4;
      --success: #2c9e57;
      --danger: #c43c3c;
      --shadow: 0 20px 50px rgba(41, 55, 86, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(93, 167, 255, 0.18), transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      transition: background var(--transition), color var(--transition);
    }

    button, input {
      font: inherit;
    }

    [hidden] { display: none !important; }

    .app {
      width: min(100%, 760px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 22px;
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .stack { display: grid; gap: 18px; }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent-soft), rgba(127, 192, 255, 0.08));
      color: var(--accent-strong);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    h1, h2, h3, p {
      margin: 0;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.9rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .icon-button {
      width: 52px;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel-2);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform var(--transition), background var(--transition), border-color var(--transition);
    }

    .icon-button:hover {
      transform: translateY(-1px);
      border-color: var(--border-strong);
    }

    .add-button {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      font-size: 1.5rem;
      line-height: 1;
      color: var(--accent-strong);
      flex-shrink: 0;
    }

    .add-button[aria-expanded="true"] {
      border-color: var(--border-strong);
      background: var(--accent-soft);
      transform: rotate(45deg);
    }

    .label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .url-input {
      width: 100%;
      padding: 17px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    .url-input::placeholder {
      color: var(--faint);
    }

    .url-input:focus {
      border-color: var(--border-strong);
      box-shadow: 0 0 0 4px rgba(93, 167, 255, 0.12);
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .btn {
      border: 0;
      border-radius: 16px;
      padding: 15px 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 150px;
      cursor: pointer;
      transition: transform var(--transition), opacity var(--transition), background var(--transition), border-color var(--transition);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #08111d;
    }

    .btn-secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .player-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 18px;
      margin-top: 18px;
    }

    .now-playing {
      padding: 18px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--accent-soft), rgba(255,255,255,0.01));
      border: 1px solid var(--border-strong);
    }

    .station-name {
      font-size: 1.16rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .station-details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .station-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 7px 10px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      border: 1px solid rgba(93, 167, 255, 0.16);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 0 8px rgba(79, 195, 107, 0.12);
      animation: pulse 1.7s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.18); opacity: 0.8; }
    }

    .volume-card {
      padding: 18px;
      border-radius: var(--radius-lg);
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .volume-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .value {
      font-weight: 700;
      font-size: 0.94rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-head p {
      color: var(--muted);
      margin-top: 4px;
      font-size: 0.95rem;
    }

    .pill {
      border-radius: 999px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Add-preset form */
    .add-form {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-strong);
      background: linear-gradient(135deg, var(--accent-soft), rgba(255,255,255,0.01));
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field { display: grid; gap: 6px; }
    .field-wide { grid-column: 1 / -1; }

    .field .label { margin: 0; }

    .add-form .url-input { padding: 13px 14px; border-radius: var(--radius-sm); }

    .form-error {
      color: var(--danger);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .add-form .controls { margin-top: 0; }

    .preset-list {
      display: grid;
      gap: 8px;
    }

    /* User-added stations: the preset plus a delete button beside it */
    .preset-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .preset-row .preset { flex: 1; min-width: 0; }

    .preset-delete {
      width: 52px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel-2);
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: color var(--transition), border-color var(--transition), background var(--transition);
    }

    .preset-delete:hover,
    .preset-delete:focus-visible {
      color: var(--danger);
      border-color: var(--danger);
      background: var(--panel-3);
    }

    .preset {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel-2);
      color: var(--text);
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      transition: transform var(--transition), background var(--transition), border-color var(--transition);
    }

    .preset:hover {
      transform: translateY(-1px);
      background: var(--panel-3);
    }

    .preset.active {
      border-color: var(--border-strong);
      background: linear-gradient(135deg, var(--accent-soft), rgba(93, 167, 255, 0.06));
      box-shadow: inset 0 0 0 1px rgba(93, 167, 255, 0.08), 0 0 0 1px rgba(93, 167, 255, 0.04);
      transform: translateY(-1px);
    }

    .preset-main {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .preset-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(93, 167, 255, 0.12);
      color: var(--accent-strong);
      flex-shrink: 0;
    }

    .preset-copy {
      min-width: 0;
      text-align: left;
    }

    .preset-name {
      display: block;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preset-sub {
      display: none;
    }

    .badge-live {
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(79, 195, 107, 0.1);
      color: #a7eeb8;
      border: 1px solid rgba(79, 195, 107, 0.16);
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .footer-note {
      margin-top: 16px;
      color: var(--faint);
      font-size: 0.88rem;
    }

    @media (max-width: 700px) {
      body { padding: 16px; }
      .app { padding: 16px; border-radius: 24px; }
      .card { padding: 18px; }
      .player-grid { grid-template-columns: 1fr; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; }
      .btn { width: 100%; min-width: 0; }
      /* keep the + button on the same row as the "Presets" title */
      .section-head { align-items: center; }
    }

    @media (max-width: 520px) {
      .topbar { align-items: flex-start; }
      .controls { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .preset { align-items: flex-start; }
      .preset-main { gap: 8px; }
      .preset-icon { width: 34px; height: 34px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="stack">
      <section class="card">
        <div class="topbar">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12a8 8 0 0 1 8-8"></path>
                <path d="M4 12a8 8 0 0 0 8 8"></path>
                <path d="M8 12a4 4 0 0 1 4-4"></path>
                <path d="M8 12a4 4 0 0 0 4 4"></path>
                <circle cx="17" cy="12" r="2"></circle>
              </svg>
            </div>
            <div>
              <h1>Radio Player</h1>
            </div>
          </div>
          <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle theme">☾</button>
        </div>

        <div class="controls" id="controlsRow" style="display: none;">
          <button class="btn btn-primary" id="playBtn" type="button">▶ Play</button>
          <button class="btn btn-secondary" id="refreshBtn" type="button">↻ Refresh</button>
        </div>

        <div class="player-grid">
          <div class="now-playing" id="nowPlayingCard" style="display: none;">
            <div class="label">Now playing</div>
            <div class="station-name" id="currentStation"></div>
            <div class="meta">
              <span class="live-dot" aria-hidden="true"></span>
              <span id="statusText"></span>
            </div>
            <div class="station-details" id="stationDetails" style="display: none;">
              <span class="station-chip" id="stationCountry"></span>
              <span class="station-chip" id="stationGenre"></span>
            </div>
          </div>

          <div class="volume-card">
            <div class="volume-row">
              <span class="label" style="margin:0;">Volume</span>
              <span class="value" id="volumeValue">68%</span>
            </div>
            <input id="volumeSlider" type="range" min="0" max="100" value="68" />
          </div>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <h2>Presets</h2>
          </div>
          <button class="icon-button add-button" id="addPresetBtn" type="button" aria-label="Add a radio preset" aria-expanded="false" aria-controls="addPresetForm">+</button>
        </div>

        <form class="add-form" id="addPresetForm" hidden novalidate>
          <div class="form-grid">
            <label class="field">
              <span class="label">Station name *</span>
              <input class="url-input" id="newName" name="name" type="text" maxlength="60" placeholder="e.g. Kiss FM" required />
            </label>
            <label class="field">
              <span class="label">Genre</span>
              <input class="url-input" id="newGenre" name="genre" type="text" maxlength="40" placeholder="e.g. Dance" />
            </label>
            <label class="field field-wide">
              <span class="label">Stream URL *</span>
              <input class="url-input" id="newUrl" name="url" type="url" placeholder="https://…/stream.mp3 or .m3u8" required />
            </label>
            <label class="field field-wide">
              <span class="label">Country</span>
              <input class="url-input" id="newCountry" name="country" type="text" maxlength="40" placeholder="e.g. Romania" />
            </label>
          </div>
          <p class="form-error" id="formError" role="alert" hidden></p>
          <div class="controls">
            <button class="btn btn-primary" type="submit">Save preset</button>
            <button class="btn btn-secondary" id="cancelAddBtn" type="button">Cancel</button>
          </div>
        </form>

        <div class="preset-list" id="presetList">
          <button class="preset" type="button" data-station="MegaStar FM" data-url="https://megastar-cope.flumotion.com/playlist.m3u8">
            <span class="preset-main">
              <span class="preset-icon">♫</span>
              <span class="preset-copy">
                <span class="preset-name">MegaStar FM</span>
                <span class="preset-sub">Spain pop hits</span>
              </span>
            </span>
            <span class="pill">Ready</span>
          </button>


          <button class="preset" type="button" data-station="m2o FM" data-url="https://streamcdnh17-4c4b867c89244861ac216426883d1ad0.msvdn.net/radiom2o/radiom2o/play1.m3u8">
            <span class="preset-main">
              <span class="preset-icon">♫</span>
              <span class="preset-copy">
                <span class="preset-name">m2o FM</span>
                <span class="preset-sub">Italy Dance</span>
              </span>
            </span>
            <span class="pill">Ready</span>
          </button>

          <button class="preset" type="button" data-station="Dance FM" data-url="https://edge126.rcs-rds.ro/profm/dancefm.mp3">
            <span class="preset-main">
              <span class="preset-icon">♫</span>
              <span class="preset-copy">
                <span class="preset-name">Dance FM</span>
                <span class="preset-sub">Club and electronic</span>
              </span>
            </span>
            <span class="pill">Ready</span>
          </button>

          <button class="preset" type="button" data-station="Off Radio" data-url="https://s7.yesstreaming.net/stream/8000">
            <span class="preset-main">
              <span class="preset-icon">♫</span>
              <span class="preset-copy">
                <span class="preset-name">Off Radio</span>
                <span class="preset-sub">Smooth lounge</span>
              </span>
            </span>
            <span class="pill">Ready</span>
          </button>

          <button class="preset" type="button" data-station="Capital FM" data-url="https://media-ssl.musicradio.com/Capital">
            <span class="preset-main">
              <span class="preset-icon">♫</span>
              <span class="preset-copy">
                <span class="preset-name">Capital FM</span>
                <span class="preset-sub">UK chart radio</span>
              </span>
            </span>
            <span class="pill">Ready</span>
          </button>

          <button class="preset" type="button" data-station="Vanilla Smooth Radio" data-url="https://smooth.vanillaradio.com:8032/live">
            <span class="preset-main">
              <span class="preset-icon">♫</span>
              <span class="preset-copy">
                <span class="preset-name">Vanilla Smooth Radio</span>
                <span class="preset-sub">Smooth radio</span>
              </span>
            </span>
            <span class="pill">Ready</span>
          </button>

          <button class="preset" type="button" data-station="Vanilla Deep Radio" data-url="https://stream.vanillaradio.com:8016/stream/stream">
            <span class="preset-main">
              <span class="preset-icon">♫</span>
              <span class="preset-copy">
                <span class="preset-name">Vanilla Deep Radio</span>
                <span class="preset-sub">Deep house</span>
              </span>
            </span>
            <span class="pill">Ready</span>
          </button>

          <button class="preset" type="button" data-station="ManCode Radio" data-url="https://stream.radiojar.com/2kqw1800x68uv">
            <span class="preset-main">
              <span class="preset-icon">♫</span>
              <span class="preset-copy">
                <span class="preset-name">ManCode Radio</span>
                <span class="preset-sub">Variety</span>
              </span>
            </span>
            <span class="pill">Ready</span>
          </button>

          <button class="preset" type="button" data-station="Europa FM" data-url="https://astreaming.edi.ro:8443/EuropaFM_aac">
            <span class="preset-main">
              <span class="preset-icon">♫</span>
              <span class="preset-copy">
                <span class="preset-name">Europa FM</span>
                <span class="preset-sub">Mainstream mix</span>
              </span>
            </span>
            <span class="pill">Ready</span>
          </button>

          <button class="preset" type="button" data-station="MC2" data-url="https://n23-eu.rcs.revma.com/txdn8d324ucwv">
            <span class="preset-main">
              <span class="preset-icon">♫</span>
              <span class="preset-copy">
                <span class="preset-name">MC2</span>
                <span class="preset-sub">International variety</span>
              </span>
            </span>
            <span class="pill">Ready</span>
          </button>

          <button class="preset" type="button" data-station="Antenne Bayern" data-url="https://s1-webradio.antenne.de/antenne/stream/aacp">
            <span class="preset-main">
              <span class="preset-icon">♫</span>
              <span class="preset-copy">
                <span class="preset-name">Antenne Bayern</span>
                <span class="preset-sub">German variety</span>
              </span>
            </span>
            <span class="pill">Ready</span>
          </button>
        </div>

      </section>
    </div>
  </main>

  <audio id="audio"></audio>

  <script>
    // HTTPS relay for http-only streams (see radio-proxy-worker.js).
    // Replace with your deployed Cloudflare Worker URL, keeping "/?url=" at the end.
    const STREAM_PROXY = 'https://radio-proxy.YOUR-SUBDOMAIN.workers.dev/?url=';

    // Browsers block (or force-upgrade) http:// audio on an https:// page,
    // so http streams are sent through the HTTPS proxy instead.
    function resolveStreamUrl(url) {
      if (location.protocol === 'https:' && url.startsWith('http://')) {
        return STREAM_PROXY + encodeURIComponent(url);
      }
      return url;
    }

    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeValue = document.getElementById('volumeValue');
    const currentStation = document.getElementById('currentStation');
    const statusText = document.getElementById('statusText');
    const stationDetails = document.getElementById('stationDetails');
    const stationCountry = document.getElementById('stationCountry');
    const stationGenre = document.getElementById('stationGenre');
    const nowPlayingCard = document.getElementById('nowPlayingCard');
    const controlsRow = document.getElementById('controlsRow');
    const playBtn = document.getElementById('playBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const audio = document.getElementById('audio');
    const presetList = document.getElementById('presetList');
    const addPresetBtn = document.getElementById('addPresetBtn');
    const addPresetForm = document.getElementById('addPresetForm');
    const cancelAddBtn = document.getElementById('cancelAddBtn');
    const formError = document.getElementById('formError');
    const newName = document.getElementById('newName');
    const newUrl = document.getElementById('newUrl');
    const newCountry = document.getElementById('newCountry');
    const newGenre = document.getElementById('newGenre');

    // Presets can be added at runtime, so always read the current list from the DOM.
    const getPresets = () => Array.from(presetList.querySelectorAll('.preset'));

    let currentStreamUrl = '';

    const stationMeta = {
      'MegaStar FM': { country: 'Spain', flag: '🇪🇸', genre: 'Pop' },
      'Stella FM': { country: 'Italy', flag: '🇮🇹', genre: 'Pop' },
      'Dance FM': { country: 'Romania', flag: '🇷🇴', genre: 'Electronic' },
      'Off Radio': { country: 'Greece', flag: '🇬🇷', genre: 'Lounge' },
      'Capital FM': { country: 'UK', flag: '🇬🇧', genre: 'Chart' },
      'Vanilla Smooth Radio': { country: 'Greece', flag: '🇬🇷', genre: 'Smooth' },
      'Vanilla Deep Radio': { country: 'Greece', flag: '🇬🇷', genre: 'Deep House' },
      'ManCode Radio': { country: 'Greece', flag: '🇬🇷', genre: 'Variety' },
      'Europa FM': { country: 'Romania', flag: '🇷🇴', genre: 'Mainstream' },
      'MC2': { country: 'Italy', flag: '🇮🇹', genre: 'Variety' },
      'Antenne Bayern': { country: 'Germany', flag: '🇩🇪', genre: 'Variety' }
    };

    // ---- User-added presets (saved in this browser's localStorage) ----
    const CUSTOM_PRESETS_KEY = 'radioPlayer.customPresets';

    function loadCustomPresets() {
      try {
        const list = JSON.parse(localStorage.getItem(CUSTOM_PRESETS_KEY));
        return Array.isArray(list) ? list.filter((p) => p && p.name && p.url) : [];
      } catch {
        return [];
      }
    }

    function saveCustomPresets(list) {
      try {
        localStorage.setItem(CUSTOM_PRESETS_KEY, JSON.stringify(list));
        return true;
      } catch {
        return false;
      }
    }

    // Built with textContent (not innerHTML) so user input can't inject markup.
    function createPresetButton({ name, url, genre }) {
      const button = document.createElement('button');
      button.className = 'preset';
      button.type = 'button';
      button.dataset.station = name;
      button.dataset.url = url;
      button.dataset.custom = 'true';

      const main = document.createElement('span');
      main.className = 'preset-main';

      const icon = document.createElement('span');
      icon.className = 'preset-icon';
      icon.textContent = '♫';

      const copy = document.createElement('span');
      copy.className = 'preset-copy';

      const nameEl = document.createElement('span');
      nameEl.className = 'preset-name';
      nameEl.textContent = name;

      const sub = document.createElement('span');
      sub.className = 'preset-sub';
      sub.textContent = genre || '';

      const pill = document.createElement('span');
      pill.className = 'pill';
      pill.textContent = 'Ready';

      copy.append(nameEl, sub);
      main.append(icon, copy);
      button.append(main, pill);
      return button;
    }

    function addPresetToUI(preset) {
      if (preset.country || preset.genre) {
        stationMeta[preset.name] = { country: preset.country || '', flag: '', genre: preset.genre || '' };
      }
      const button = createPresetButton(preset);

      // Only user-added stations get a delete button (a sibling, since buttons can't nest).
      const row = document.createElement('div');
      row.className = 'preset-row';

      const del = document.createElement('button');
      del.className = 'preset-delete';
      del.type = 'button';
      del.title = 'Delete station';
      del.setAttribute('aria-label', `Delete ${preset.name}`);
      del.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>';

      row.append(button, del);
      presetList.appendChild(row);
      return button;
    }

    function deleteCustomPreset(row) {
      const button = row.querySelector('.preset');
      const { station, url } = button.dataset;
      if (!confirm(`Delete "${station}" from your presets?`)) return;

      const remaining = loadCustomPresets().filter((p) => p.url !== url);
      if (!saveCustomPresets(remaining)) {
        alert('Could not delete the preset (browser storage is unavailable).');
        return;
      }

      // If the deleted station is the selected one, stop it and clear Now playing.
      if (url === currentStreamUrl) {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        currentStreamUrl = '';
        showNowPlaying(null);
        updatePlayButton();
      }

      delete stationMeta[station];
      row.remove();
    }

    function syncThemeIcon() {
      themeToggle.textContent = root.getAttribute('data-theme') === 'dark' ? '☾' : '☀';
    }

    function updatePlayButton() {
      const isPlaying = !audio.paused && !audio.ended;
      playBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
    }

    function setStatus(message) {
      statusText.textContent = message;
    }

    function updatePresetStates() {
      getPresets().forEach((preset) => {
        const badge = preset.querySelector('.pill');
        if (!badge) return;

        const isPlaying = preset.dataset.url === currentStreamUrl && !audio.paused && !audio.ended;
        badge.textContent = isPlaying ? 'Live' : 'Ready';
      });
    }

    function showNowPlaying(station) {
      if (!station) {
        nowPlayingCard.style.display = 'none';
        controlsRow.style.display = 'none';
        currentStation.textContent = '';
        statusText.textContent = '';
        stationCountry.textContent = '';
        stationGenre.textContent = '';
        stationDetails.style.display = 'none';
        updatePresetStates();
        return;
      }

      const meta = stationMeta[station];
      currentStation.textContent = station;
      nowPlayingCard.style.display = 'block';
      controlsRow.style.display = 'flex';

      if (meta) {
        const countryText = [meta.flag, meta.country].filter(Boolean).join(' ');
        stationCountry.textContent = countryText;
        stationCountry.style.display = countryText ? '' : 'none';
        stationGenre.textContent = meta.genre || '';
        stationGenre.style.display = meta.genre ? '' : 'none';
        stationDetails.style.display = 'flex';
      } else {
        stationCountry.textContent = '';
        stationGenre.textContent = '';
        stationDetails.style.display = 'none';
      }

      updatePresetStates();
    }

    function playRadio(url = currentStreamUrl) {
      if (!url) {
        setStatus('Please select a preset first.');
        return;
      }

      currentStreamUrl = url;

      const src = resolveStreamUrl(url);
      if (audio.src !== src) {
        audio.src = src;
      }

      const selectedStation = currentStation.textContent || 'Selected station';
      setStatus(`Attempting to play ${selectedStation}`);
      audio.play()
        .then(() => {
          updatePlayButton();
          updatePresetStates();
          setStatus(`Live stream active`);
        })
        .catch(() => {
          updatePlayButton();
          updatePresetStates();
          setStatus(`Unable to play ${selectedStation}`);
          alert('Unable to play this stream.');
        });
    }

    function refreshStream() {
      if (!currentStreamUrl) {
        setStatus('Please select a preset first.');
        return;
      }

      const src = resolveStreamUrl(currentStreamUrl);
      setStatus('Refreshing stream…');
      audio.src = src;
      audio.load();
      audio.play().catch(() => {
        setStatus(`Unable to refresh ${currentStation.textContent}`);
        alert('Unable to refresh this stream.');
      });
    }

    themeToggle.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      syncThemeIcon();
    });

    syncThemeIcon();

    volumeSlider.addEventListener('input', () => {
      const value = Number(volumeSlider.value);
      volumeValue.textContent = `${value}%`;
      audio.volume = value / 100;
    });

    // One delegated listener covers both built-in and user-added presets.
    presetList.addEventListener('click', (event) => {
      const deleteBtn = event.target.closest('.preset-delete');
      if (deleteBtn) {
        deleteCustomPreset(deleteBtn.closest('.preset-row'));
        return;
      }

      const preset = event.target.closest('.preset');
      if (!preset || !presetList.contains(preset)) return;

      getPresets().forEach((item) => item.classList.remove('active'));
      preset.classList.add('active');
      const station = preset.dataset.station;
      const url = preset.dataset.url;
      showNowPlaying(station);
      currentStreamUrl = url;
      updatePresetStates();
      setStatus(`Ready to play ${station}`);
      playRadio(url);
    });

    // ---- Add-preset form ----
    function showFormError(message) {
      formError.textContent = message;
      formError.hidden = !message;
    }

    function openAddForm() {
      addPresetForm.hidden = false;
      addPresetBtn.setAttribute('aria-expanded', 'true');
      addPresetBtn.setAttribute('aria-label', 'Close add preset form');
      newName.focus();
    }

    function closeAddForm() {
      addPresetForm.reset();
      showFormError('');
      addPresetForm.hidden = true;
      addPresetBtn.setAttribute('aria-expanded', 'false');
      addPresetBtn.setAttribute('aria-label', 'Add a radio preset');
    }

    addPresetBtn.addEventListener('click', () => {
      if (addPresetForm.hidden) {
        openAddForm();
      } else {
        closeAddForm();
      }
    });

    cancelAddBtn.addEventListener('click', closeAddForm);

    addPresetForm.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeAddForm();
    });

    addPresetForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const name = newName.value.trim();
      const url = newUrl.value.trim();
      const country = newCountry.value.trim();
      const genre = newGenre.value.trim();

      if (!name) {
        showFormError('Please enter a station name.');
        newName.focus();
        return;
      }

      let parsed;
      try {
        parsed = new URL(url);
      } catch {
        parsed = null;
      }
      if (!parsed || !['http:', 'https:'].includes(parsed.protocol)) {
        showFormError('Please enter a valid stream URL starting with http:// or https://');
        newUrl.focus();
        return;
      }

      const existing = getPresets();
      if (existing.some((p) => p.dataset.station.toLowerCase() === name.toLowerCase())) {
        showFormError('A preset with this name already exists.');
        newName.focus();
        return;
      }
      if (existing.some((p) => p.dataset.url === url)) {
        showFormError('This stream URL is already in your presets.');
        newUrl.focus();
        return;
      }

      const preset = { name, url, country, genre };
      const custom = loadCustomPresets();
      custom.push(preset);
      if (!saveCustomPresets(custom)) {
        showFormError('Could not save the preset (browser storage is unavailable).');
        return;
      }

      const button = addPresetToUI(preset);
      closeAddForm();
      button.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      button.focus({ preventScroll: true });
    });

    // Restore user-added presets at the end of the list.
    loadCustomPresets().forEach(addPresetToUI);

    playBtn.addEventListener('click', () => {
      if (audio.paused || audio.ended) {
        playRadio();
      } else {
        audio.pause();
        updatePlayButton();
        updatePresetStates();
        setStatus('Playback paused');
      }
    });

    refreshBtn.addEventListener('click', () => {
      refreshStream();
    });

    audio.addEventListener('playing', () => {
      updatePlayButton();
      updatePresetStates();
      if (currentStation.textContent) {
        setStatus('Live stream active');
      }
    });

    audio.addEventListener('pause', () => {
      updatePlayButton();
      updatePresetStates();
      if (currentStation.textContent) {
        setStatus('Playback paused');
      }
    });

    audio.addEventListener('waiting', () => {
      updatePresetStates();
      setStatus('Buffering…');
    });

    audio.addEventListener('ended', () => {
      updatePlayButton();
      updatePresetStates();
      if (currentStation.textContent) {
        setStatus('Stream ended');
      }
    });

    audio.addEventListener('error', () => {
      updatePlayButton();
      updatePresetStates();
      setStatus('Stream error');
      alert('Stream error.');
    });

    audio.volume = 0.68;
    volumeSlider.value = 68;
    volumeValue.textContent = '68%';
    updatePresetStates();
    updatePlayButton();

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.log('Service Worker registration failed:', err));
    } else if (location.protocol === 'file:') {
      console.log('Service Worker skipped because the page is loaded from file://');
    }
  </script>
</body>
</html>
